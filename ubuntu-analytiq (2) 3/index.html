    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0f172a', // Slate 900

                secondary: '#3b82f6', // Blue 500

            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
