<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.bunny.net" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Master Data & AI for Africa at Ubuntu AnalytIQ. World-class training in Data Analytics, AI Fluency, and Agentic Systems." />
  <meta name="keywords" content="Data Analytics, AI Fluency, Agentic Systems, Power BI, Excel, n8n, AI courses Africa, Kenya Data" />
  <title>Ubuntu AnalytIQ - AI & Data Fluency</title>
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#1E1616',      // Logo's dark brown/black background
              surface: '#2A2222',   // Lighter shade for cards/sections
              cyan: '#00B4D8',      // Cyan accent (matches logo dots)
              red: '#9E2A2B',       // Dark red (matches "IQ" in logo)
              blue: '#00B4D8',      // Using cyan as primary blue
              purple: '#9E2A2B'     // Using red for purple variant
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            glow: {
              '0%': { boxShadow: '0 0 5px #00B4D8' },
              '100%': { boxShadow: '0 0 20px #00B4D8', borderColor: '#00B4D8' },
            }
          }
        },
      },
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      background-color: #1E1616;
      color: #F1F5F9;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1E1616;
    }

    ::-webkit-scrollbar-thumb {
      background: #2A2222;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00B4D8;
    }
  </style>

}
